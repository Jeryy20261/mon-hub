<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Hub Sécurisé</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #hubContent { display: none; }
        .page { display: none; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div id="authSection" class="card">
        <h2>Connexion</h2>
        <form id="loginForm">
            <input type="text" id="loginUser" placeholder="Identifiant" required>
            <input type="password" id="loginPass" placeholder="Mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
        <div id="loginMsg"></div>
    </div>

    <div id="hubContent" class="card">
        <h1>Mon Hub</h1>
        <nav>
            <button onclick="showPage('home')">Accueil</button>
            <button onclick="showPage('videos')">Vidéos</button>
            <button onclick="showPage('images')">Images</button>
        </nav>
        <hr>
        <div id="home" class="page" style="display:block;"><h3>Accueil</h3><p>Bienvenue.</p></div>
        <div id="videos" class="page"><h3>Vidéos</h3><div id="videoList" class="loading">Chargement...</div></div>
        <div id="images" class="page"><h3>Images</h3><div id="imageList" class="loading">Chargement...</div></div>
        <hr>
        <button onclick="logout()" style="background:red;">Se déconnecter</button>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwljH1v8_0W6sr-Vxo5dmlVd0ua-2R2ajyPMK1XdqbD-wLbC_xJMWbtkkjvwpz-lTTs/exec";

        window.onload = () => {
            if (localStorage.getItem('isLoggedIn') === 'true') {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('hubContent').style.display = 'block';
            }
        };

        async function hashPassword(p) {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(p));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('loginUser').value;
            const passwordHash = await hashPassword(document.getElementById('loginPass').value);
            
            const res = await fetch(WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "login", username, passwordHash })
            });
            const data = await res.json();
            
            if (data.result === "success") {
                localStorage.setItem('isLoggedIn', 'true');
                location.reload();
            } else {
                document.getElementById('loginMsg').innerText = data.message;
            }
        };

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if(id === 'videos' || id === 'images') loadHubData();
        }

        async function loadHubData() {
            const vList = document.getElementById('videoList');
            const iList = document.getElementById('imageList');
            try {
                const res = await fetch(WEB_APP_URL);
                const data = await res.json();
                
                // --- DEBUG ICI ---
                console.log("Données reçues du Google Sheet :", data);
                
                vList.innerHTML = ""; iList.innerHTML = "";
                data.forEach(item => {
                    if (item.category === "Video") {
                        vList.innerHTML += `<p>${item.name}</p>`;
                    } else if (item.category === "Image") {
                        iList.innerHTML += `<div style="margin-bottom:10px;"><p>${item.name}</p><img src="${item.description}" style="width:100px;"></div>`;
                    }
                });
            } catch (err) {
                vList.innerHTML = "Erreur de chargement.";
                console.error(err);
            }
        }

        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        }
    </script>
</body>
</html>
